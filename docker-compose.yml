name: profilsactifs

x-app-env: &app-env
  DATABASE_URL: file:/data/profilsactifs.db
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me-in-production}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
  NEXT_TELEMETRY_DISABLED: "1"
  # Hebergeur video. `local` par defaut ; poser VIDEO_PROVIDER=peertube dans
  # l'environnement (ou dans .env) bascule sur l'instance PeerTube
  # factice et met le dispositif en mode degrade.
  VIDEO_PROVIDER: ${VIDEO_PROVIDER:-local}
  VIDEO_EMBED_ENABLED: ${VIDEO_EMBED_ENABLED:-false}
  VIDEO_PEERTUBE_URL: ${VIDEO_PEERTUBE_URL:-}
  VIDEO_LOCAL_PROCESSING_MS: ${VIDEO_LOCAL_PROCESSING_MS:-0}

services:
  web-dev:
    build:
      context: .
      target: dev
    container_name: profilsactifs-dev
    environment:
      <<: *app-env
      NODE_ENV: development
      # inotify ne traverse pas le bind mount sous Docker Desktop / WSL2.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - db-data-dev:/data
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
  web:
    profiles: ["prod"]
    build:
      context: .
      target: runner
    image: profilsactifs:latest
    container_name: profilsactifs
    environment:
      <<: *app-env
      NODE_ENV: production
    volumes:
      - db-data-prod:/data
    ports:
      - "${PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:

  db-data-dev:
  db-data-prod:
